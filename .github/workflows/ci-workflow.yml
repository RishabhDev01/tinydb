name: Python CI

# Slimmed for the AutoSE fork (see autose-a3 ADR-012):
# - one OS, two Python versions, no Coveralls upload (not configured on the fork)
# - workflow_dispatch so the AutoSE release stage can start CI on a bot branch.
#   PRs opened with GITHUB_TOKEN do not trigger pull_request workflows,
#   but workflow_dispatch from GITHUB_TOKEN is allowed.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov -e .
    - name: Run test suite
      run: python -m pytest -q
